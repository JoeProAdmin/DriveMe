# Base MySQL locale XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/driveme?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate controle le schema sans le modifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Frontend Angular local
app.cors.allowed-origins=http://localhost:4200,http://localhost:56401

