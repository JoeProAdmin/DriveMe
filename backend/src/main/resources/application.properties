spring.application.name=driveme

# Le profil local est utilisé par défaut sur le poste de développement.
spring.profiles.default=local

server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Flyway
# Une base historique non vide sans historique Flyway est baselined en V1.
# Une base neuve execute V1 puis V2.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration