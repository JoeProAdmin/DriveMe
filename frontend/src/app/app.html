<div class="driveme-responsive-shell" [class.admin-layout]="isDashboardRoute">

  <!-- ZONE DE RENDU DES PAGES -->
  <div class="main-workspace-area">
    <div class="viewport-router-scroll">
      <router-outlet></router-outlet>
    </div>

    <!-- BARRE TACTILE INFÉRIEURE : Active uniquement sur Mobile pour l'application chauffeur/passager -->
    <nav class="mobile-bottom-tabbar" *ngIf="!isDashboardRoute">
      <button type="button" class="tab-item" routerLink="/create-course" routerLinkActive="active">
        <span class="tab-label">Home</span>
      </button>
      <button type="button" class="tab-item" routerLink="/courses" routerLinkActive="active">
        <span class="tab-label">Histo</span>
      </button>
      <button type="button" class="tab-item" routerLink="/payments" routerLinkActive="active">
        <span class="tab-label">Wallet</span>
      </button>
      <button type="button" class="tab-item" routerLink="/dashboard" routerLinkActive="active">
        <span class="tab-label">Profil</span>
      </button>
    </nav>
  </div>

</div>
