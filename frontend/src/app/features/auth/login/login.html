<div [style.direction]="currentLang === 'AR' ? 'rtl' : 'ltr'" style="width: 100vw; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; font-family: 'Poppins', 'Segoe UI', sans-serif; box-sizing: border-box; overflow-x: hidden; margin: 0; padding: 0;">

  <header style="background-color: #0f172a; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 64px; box-sizing: border-box; width: 100%; border-bottom: 2px solid #00C853; position: relative;">

    <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.04em;">
      Drive<span style="color: #00C853;">Me</span>
    </div>

    <div style="position: relative; display: inline-block;">

      <button
        type="button"
        (click)="dropdownOpen = !dropdownOpen"
        style="background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 13px; font-weight: 700; color: #ffffff; outline: none;">

        <span>{{ currentLang === 'AR' ? 'MA' : currentLang }}</span>
        <span style="font-size: 10px; color: #94a3b8;">▼</span>

      </button>

      <div
        *ngIf="dropdownOpen"
        [style.right]="currentLang !== 'AR' ? '0' : 'auto'"
        [style.left]="currentLang === 'AR' ? '0' : 'auto'"
        style="position: absolute; top: 38px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); width: 120px; z-index: 100; display: flex; flex-direction: column; padding: 4px 0; box-sizing: border-box;">

        <button type="button" (click)="changeLangViaDropdown('FR')" style="background: transparent; border: none; padding: 8px 12px; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; text-align: start;">
          FR
        </button>

        <button type="button" (click)="changeLangViaDropdown('AR')" style="background: transparent; border: none; padding: 8px 12px; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; text-align: start;">
          AR
        </button>

        <button type="button" (click)="changeLangViaDropdown('EN')" style="background: transparent; border: none; padding: 8px 12px; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; text-align: start;">
          EN
        </button>

        <button type="button" (click)="changeLangViaDropdown('ES')" style="background: transparent; border: none; padding: 8px 12px; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; text-align: start;">
          ES
        </button>

      </div>

    </div>

  </header>

  <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">

    <div style="width: 100%; max-width: 400px;">

      <h1 style="font-size: 24px; font-weight: 600; color: #0f172a; margin: 0 0 24px 0; text-align: start;">
        {{ dictionary[currentLang].title }}
      </h1>

      <form (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 14px; width: 100%;">

        <input
          type="email"
          name="email"
          [(ngModel)]="loginData.email"
          [placeholder]="dictionary[currentLang].placeholderEmail"
          required
          style="width: 100%; padding: 14px 16px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box;">

        <input
          type="password"
          name="motDePasse"
          [(ngModel)]="loginData.motDePasse"
          [placeholder]="dictionary[currentLang].placeholderPass"
          required
          style="width: 100%; padding: 14px 16px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box;">

        <button
          type="submit"
          style="width: 100%; background-color: #0f172a; color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;">

          {{ dictionary[currentLang].btnContinue }}

        </button>

      </form>

      <div style="display: flex; align-items: center; text-align: center; margin: 24px 0; color: #cbd5e1; font-size: 14px;">
        <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
        <span style="padding: 0 12px; color: #64748b; font-weight: 500;">ou</span>
        <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">

        <button type="button" style="width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px;">
          Google
        </button>

        <button type="button" style="width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px;">
          Apple
        </button>

        <button
          type="button"
          (click)="toggleQrModal(true)"
          style="width: 100%; background-color: rgba(0,200,83,0.06); color: #00C853; border: 1px solid rgba(0,200,83,0.2); padding: 12px; border-radius: 8px; font-weight: 600;">

          Connexion par QR

        </button>

      </div>

      <p style="font-size: 12px; color: #64748b; margin-top: 28px; line-height: 1.5;">
        {{ dictionary[currentLang].legal }}
      </p>

    </div>

  </div>

</div>
