<div class="auth-page" [class.rtl]="currentLang === 'AR'">
  <app-header mode="auth" [currentLang]="currentLang" (languageChange)="changeLangViaDropdown($any($event))" />

  <main class="auth-main">
    <section class="auth-card">
      <h1>{{ dictionary[currentLang].title }}</h1>
      <p class="subtitle">{{ api.t('login.subtitle') }}</p>

      <div *ngIf="errorMessage" class="message error">{{ errorMessage }}</div>
      <div *ngIf="informationMessage" class="message information" role="status">{{ informationMessage }}</div>

      <form (ngSubmit)="onSubmit()" novalidate>
        <label for="identifiant">{{ dictionary[currentLang].identifier }}</label>
        <input id="identifiant" name="identifiant" [(ngModel)]="loginData.identifiant" autocomplete="username" [placeholder]="api.t('login.identifierPlaceholder')">

        <div class="label-row">
          <label for="motDePasse">{{ dictionary[currentLang].password }}</label>
          <button type="button" class="link-button" (click)="showForgotPasswordInformation()">{{ dictionary[currentLang].forgot }}</button>
        </div>
        <div class="password-field">
          <input id="motDePasse" name="motDePasse" [(ngModel)]="loginData.motDePasse" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password">
          <button type="button" (click)="showPassword = !showPassword">{{ showPassword ? api.t('login.hide') : api.t('login.show') }}</button>
        </div>

        <button class="primary" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? dictionary[currentLang].loading : dictionary[currentLang].submit }}</button>
      </form>

      <div class="separator"><span>{{ dictionary[currentLang].or }}</span></div>
      <div class="external-grid">
        <button type="button" disabled><span class="provider-icon google-icon" aria-hidden="true">G</span><span>{{ dictionary[currentLang].google }}</span></button>
        <button type="button" disabled><svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.33.07 2.26.73 3.04.79 1.17-.24 2.29-.93 3.54-.84 1.5.12 2.63.71 3.38 1.78-3.1 1.86-2.36 5.95.48 7.09-.57 1.5-1.31 2.99-2.44 4.16zM12.03 7.25C11.88 5.02 13.69 3.18 15.77 3c.29 2.58-2.34 4.5-3.74 4.25z"/></svg><span>{{ dictionary[currentLang].apple }}</span></button>
        <button type="button" disabled><svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3V3zm2 2v3h3V5H5zm9-2h7v7h-7V3zm2 2v3h3V5h-3zM3 14h7v7H3v-7zm2 2v3h3v-3H5zm9-2h3v3h-3v-3zm4 0h3v7h-3v-3h-2v3h-2v-3h2v-2h2v-2z"/></svg><span>{{ dictionary[currentLang].qr }}</span></button>
      </div>

      <a routerLink="/register" class="register-link">{{ dictionary[currentLang].register }}</a>
    </section>
  </main>
</div>
