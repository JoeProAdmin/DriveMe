<div class="container">

  <div class="card">

    <div class="logo">DriveMe</div>

    <form (ngSubmit)="onLogin()">

      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Mot de passe"
        required
      >

      <button type="submit">Se connecter</button>

    </form>

    <p class="success" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </div>

</div>
