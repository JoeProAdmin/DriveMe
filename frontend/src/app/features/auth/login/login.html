<div class="auth-split-container">

  <!-- PANNEAU VISUEL : IMMERSION MOBILITÉ MAROC (MARRAKECH/RABAT) -->
  <div class="auth-visual-side">
    <div class="visual-overlay"></div>
    <img src="https://images.unsplash.com/photo-1539650116574-8efeb43e2750?auto=format&fit=crop&w=1200&q=80" alt="DriveMe Maroc Urban Mobility" class="bg-photo">
    <div class="visual-content">
      <h1 class="brand-logo-text">DriveMe</h1>
      <p class="brand-tagline">Votre chauffeur privé partout au Maroc. Commandez une course en toute transparence, sans frais cachés.</p>
    </div>
  </div>

  <!-- PANNEAU FORMULAIRE DE CONNEXION -->
  <div class="auth-form-side">
    <div class="form-wrapper">
      <header class="form-header">
        <h2>Connexion Espace Privé</h2>
        <p class="form-caption">Heureux de vous revoir. Saisissez vos identifiants pour planifier votre prochain trajet.</p>
      </header>

      <div *ngIf="errorMessage" class="ui-alert error">{{ errorMessage }}</div>

      <form (ngSubmit)="executerConnexion()">

        <div class="input-block">
          <label>Adresse Email</label>
          <input type="email" [(ngModel)]="credentials.email" name="email" placeholder="admin2@driveme.com" required>
        </div>

        <div class="input-block">
          <label>Mot de passe</label>
          <input type="password" [(ngModel)]="credentials.motDePasse" name="motDePasse" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary-action" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Se connecter au système</span>
          <span *ngIf="isSubmitting">Authentification sécurisée en cours...</span>
        </button>

        <footer class="form-footer-links">
          <p>Nouveau sur DriveMe ? <a routerLink="/auth/register">Créer un compte marocain</a></p>
        </footer>

      </form>
    </div>
  </div>

</div>
