<div [style.direction]="currentLang === 'AR' ? 'rtl' : 'ltr'" style="width: 100vw; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; font-family: 'Poppins', sans-serif;">
  <header style="background-color: #0f172a; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 64px; border-bottom: 2px solid #00C853;">
    <div style="font-size: 24px; font-weight: 700;">Drive<span style="color: #00C853;">Me</span></div>
    <div style="cursor: pointer;" (click)="dropdownOpen = !dropdownOpen">FR ▼</div>
  </header>

  <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">
    <div style="width: 100%; max-width: 400px;">
      <h1 style="font-size: 24px; font-weight: 600; margin-bottom: 24px;">{{ dictionary[currentLang].title }}</h1>

      <form (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 16px;">
        <input type="email" name="email" [(ngModel)]="loginData.email" placeholder="Email..."
               style="width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px;">

        <input type="password" name="motDePasse" [(ngModel)]="loginData.motDePasse" placeholder="Mot de passe..."
               style="width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px;">

        <button type="submit" style="background: #0f172a; color: #fff; padding: 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;">
          {{ dictionary[currentLang].btnContinue }}
        </button>
      </form>

      <div style="margin: 24px 0; text-align: center; color: #64748b;">ou</div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button style="padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; cursor: pointer;">Google</button>
        <button style="padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; cursor: pointer;">Apple</button>
        <button (click)="toggleQrModal(true)" style="padding: 12px; border: 1px solid #00C853; border-radius: 8px; background: #f0fdf4; color: #00C853; cursor: pointer;">Connexion par QR</button>
      </div>
    </div>
  </div>
</div>
