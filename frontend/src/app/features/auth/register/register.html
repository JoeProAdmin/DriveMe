<div style="width: 100vw; min-height: 100vh; background-color: #f8fafc; display: flex; flex-direction: column; font-family: 'Poppins', 'Segoe UI', sans-serif; box-sizing: border-box; margin: 0; padding: 0;">

  <!-- HEADER AMÉLIORÉ -->
  <header style="background-color: #0f172a; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; height: 64px; box-sizing: border-box; width: 100%; border-bottom: 2px solid #00C853; flex-shrink: 0;">
    <div style="font-size: 24px; font-weight: 700; cursor: pointer;" (click)="resetFlow()">Drive<span style="color: #00C853;">Me</span></div>
    <button *ngIf="currentFlow" type="button" (click)="resetFlow()" style="background: #ffffff15; border: 1px solid #ffffff30; color: white; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;">
      ← Retour
    </button>
  </header>

  <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; box-sizing: border-box;">

    <!-- CHOIX PROFIL -->
    <div *ngIf="!currentFlow" style="width: 100%; max-width: 500px; background-color: #ffffff; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(15,23,42,0.03); border: 1px solid #e2e8f0; text-align: center;">
      <h1 style="font-size: 28px; font-weight: 700; color: #0f172a; margin: 0 0 8px 0;">Créer un compte DriveMe</h1>
      <p style="font-size: 14px; color: #64748b; margin-bottom: 32px;">Sélectionnez votre profil.</p>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div (click)="selectFlow('PASSAGER')" style="border: 2px solid #e2e8f0; padding: 20px; border-radius: 12px; cursor: pointer; text-align: left;">
          <div style="font-weight: 700; color: #0f172a;">Je suis Passager</div>
        </div>
        <div (click)="selectFlow('CONDUCTEUR')" style="border: 2px solid #e2e8f0; padding: 20px; border-radius: 12px; cursor: pointer; text-align: left;">
          <div style="font-weight: 700; color: #0f172a;">Je suis Conducteur</div>
        </div>
      </div>
    </div>

    <!-- FORMULAIRE PASSAGER (Avec capture caméra) -->
    <div *ngIf="currentFlow === 'PASSAGER'" style="width: 100%; max-width: 420px; background-color: #ffffff; padding: 32px; border-radius: 16px; border: 1px solid #e2e8f0;">
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 24px;">Inscription Passager</h2>
      <form (ngSubmit)="submitPassenger()" style="display: flex; flex-direction: column; gap: 16px;">
        <!-- Champs texte inchangés -->
        <div style="display: flex; gap: 12px;">
          <input type="text" [(ngModel)]="passengerForm.nom" name="pNom" placeholder="Nom" required style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px;">
          <input type="text" [(ngModel)]="passengerForm.prenom" name="pPrenom" placeholder="Prénom" required style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px;">
        </div>
        <input type="tel" [(ngModel)]="passengerForm.telephone" name="pPhone" placeholder="Téléphone" required style="width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:6px;">

        <div>
          <label style="font-size: 11px; font-weight: 700; color: #475569;">SELFIE BIOMÉTRIQUE</label>
          <div style="border: 2px dashed #cbd5e1; padding: 20px; border-radius: 8px; text-align: center; position: relative; background: #f8fafc;">
            <!-- Ajout de capture="environment" ici -->
            <input type="file" accept="image/*" capture="environment" (change)="onFileSelected($event, 'passengerSelfie')" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;">
            <div style="font-size: 13px; color: #64748b;">📷 Prendre photo ou téléverser</div>
            <img *ngIf="previews['passengerSelfie']" [src]="previews['passengerSelfie']" style="max-height: 80px; margin-top: 10px;">
          </div>
        </div>
        <button type="submit" style="width:100%; background-color:#0f172a; color:white; padding:14px; border-radius:8px; cursor:pointer;">Valider</button>
      </form>
    </div>

    <!-- FORMULAIRE CONDUCTEUR (Étape 2, 3, 4 mises à jour avec capture="environment") -->
    <div *ngIf="currentFlow === 'CONDUCTEUR'" style="width: 100%; max-width: 550px; background-color: #ffffff; padding: 36px; border-radius: 16px; border: 1px solid #e2e8f0;">
      <!-- ... (Header étape 1 inchangé) ... -->

      <!-- ÉTAPE 2 (Pièces) : Ajout de capture="environment" sur chaque input -->
      <div *ngIf="currentStep === 2" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; gap: 16px;">
          <div style="flex: 1;">
            <label>CIN</label>
            <div style="border: 2px dashed #cbd5e1; padding: 14px; position: relative;">
              <input type="file" accept="image/*" capture="environment" (change)="onFileSelected($event, 'cin')" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;">
              <span style="font-size: 12px;">📷 Caméra ou Fichier</span>
            </div>
          </div>
          <!-- Répétez ce pattern pour Permis, Carte Grise, Assurance -->
        </div>
      </div>

      <!-- ÉTAPE 4 (Selfie) : Ajout de capture="environment" -->
      <div *ngIf="currentStep === 4">
        <label>SELFIE BIOMÉTRIQUE</label>
        <div style="border: 2px dashed #cbd5e1; padding: 24px; position: relative;">
          <input type="file" accept="image/*" capture="environment" (change)="onFileSelected($event, 'selfieControle')" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;">
          <div style="font-size: 13px;">📷 Selfie temps réel ou Fichier</div>
        </div>
      </div>

      <!-- Boutons navigation (inchangés) -->
    </div>
  </div>
</div>
