<div style="min-height:100vh; background:#f8fafc; font-family:'Poppins','Segoe UI',sans-serif;">
  <header style="height:64px; background:#0f172a; color:white; display:flex; align-items:center; justify-content:space-between; padding:0 40px; border-bottom:2px solid #00C853;">
    <div style="font-size:24px; font-weight:700; cursor:pointer;" (click)="resetFlow()">Drive<span style="color:#00C853;">Me</span></div>
    <button *ngIf="currentFlow" type="button" (click)="resetFlow()" style="background:transparent; border:1px solid #334155; color:white; padding:8px 18px; border-radius:6px; cursor:pointer;">Retour</button>
  </header>

  <main style="min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center; padding:40px 20px;">

    <section *ngIf="!currentFlow" style="width:100%; max-width:520px; background:white; padding:32px; border-radius:16px; border:1px solid #e2e8f0;">
      <h1 style="margin:0 0 12px 0; color:#0f172a;">Créer un compte DriveMe</h1>
      <p style="color:#64748b; margin-bottom:28px;">Sélectionnez votre profil.</p>

      <button type="button" (click)="selectFlow('PASSAGER')" style="width:100%; text-align:left; padding:20px; margin-bottom:14px; background:white; border:2px solid #e2e8f0; border-radius:12px; cursor:pointer;">
        <strong>Je suis Passager</strong><br>
        <span>Commander une course au prix proposé.</span>
      </button>

      <button type="button" (click)="selectFlow('CONDUCTEUR')" style="width:100%; text-align:left; padding:20px; background:white; border:2px solid #e2e8f0; border-radius:12px; cursor:pointer;">
        <strong>Je suis Chauffeur</strong><br>
        <span>Recevoir des demandes et gérer mon activité.</span>
      </button>
    </section>

    <section *ngIf="currentFlow === 'PASSAGER'" style="width:100%; max-width:440px; background:white; padding:32px; border-radius:16px; border:1px solid #e2e8f0;">
      <h2 style="margin-top:0; color:#0f172a;">Inscription Passager</h2>

      <label>Nom</label>
      <input name="pNom" [(ngModel)]="passengerForm.nom" type="text" style="width:100%; padding:12px; margin:6px 0 14px; border:1px solid #cbd5e1; border-radius:8px;">

      <label>Prénom</label>
      <input name="pPrenom" [(ngModel)]="passengerForm.prenom" type="text" style="width:100%; padding:12px; margin:6px 0 14px; border:1px solid #cbd5e1; border-radius:8px;">

      <label>Téléphone obligatoire</label>
      <input name="pTelephone" [(ngModel)]="passengerForm.telephone" type="tel" style="width:100%; padding:12px; margin:6px 0 14px; border:1px solid #cbd5e1; border-radius:8px;">

      <label>Email facultatif</label>
      <input name="pEmail" [(ngModel)]="passengerForm.email" type="email" style="width:100%; padding:12px; margin:6px 0 20px; border:1px solid #cbd5e1; border-radius:8px;">

      <button type="button" (click)="submitPassenger()" [disabled]="isSubmitting" style="width:100%; padding:14px; background:#0f172a; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">
        {{ isSubmitting ? 'Inscription...' : 'Valider mon inscription' }}
      </button>
    </section>

    <section *ngIf="currentFlow === 'CONDUCTEUR'" style="width:100%; max-width:440px; background:white; padding:32px; border-radius:16px; border:1px solid #e2e8f0;">
      <h2 style="margin-top:0; color:#0f172a;">Inscription Chauffeur</h2>

      <label>Nom</label>
      <input name="dNom" [(ngModel)]="driverForm.nom" type="text" style="width:100%; padding:12px; margin:6px 0 14px; border:1px solid #cbd5e1; border-radius:8px;">

      <label>Prénom</label>
      <input name="dPrenom" [(ngModel)]="driverForm.prenom" type="text" style="width:100%; padding:12px; margin:6px 0 14px; border:1px solid #cbd5e1; border-radius:8px;">

      <label>Téléphone obligatoire</label>
      <input name="dTelephone" [(ngModel)]="driverForm.telephone" type="tel" style="width:100%; padding:12px; margin:6px 0 14px; border:1px solid #cbd5e1; border-radius:8px;">

      <label>Email obligatoire</label>
      <input name="dEmail" [(ngModel)]="driverForm.email" type="email" style="width:100%; padding:12px; margin:6px 0 20px; border:1px solid #cbd5e1; border-radius:8px;">

      <button type="button" (click)="submitDriver()" [disabled]="isSubmitting" style="width:100%; padding:14px; background:#00C853; color:white; border:none; border-radius:8px; font-weight:700; cursor:pointer;">
        {{ isSubmitting ? 'Inscription...' : 'Valider mon inscription chauffeur' }}
      </button>
    </section>

  </main>
</div>
