<div style="position: relative; width: 100%; height: 100vh; overflow: hidden; font-family: 'Poppins', sans-serif;">

  <div id="driveme-interactive-map" style="width: 100%; height: 100%; z-index: 1;"></div>

  <div style="position: absolute; top: 24px; left: 24px; z-index: 10; width: 100%; max-width: 380px; background-color: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 24px; box-sizing: border-box;">

    <h2 style="font-size: 20px; font-weight: 600; color: #0f172a; margin: 0 0 20px 0;">Commander une course</h2>

    <form (ngSubmit)="onFindDriver()" style="display: flex; flex-direction: column; gap: 16px;">

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 11px; font-weight: 700; color: #64748b;">LIEU DE PRISE EN CHARGE</label>
        <input type="text" name="departure" [(ngModel)]="formModel.adresseDepart" placeholder="Ex: Gare de Marrakech" required
               style="width: 100%; padding: 12px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 11px; font-weight: 700; color: #64748b;">DESTINATION</label>
        <input type="text" name="destination" [(ngModel)]="formModel.adresseArrivee" placeholder="Ex: Gueliz ou Casablanca" required
               style="width: 100%; padding: 12px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 11px; font-weight: 700; color: #64748b;">VOTRE TARIF PROPOSÉ (MAD)</label>
        <input type="number" name="price" [(ngModel)]="formModel.prix" placeholder="Ex: 30" required min="5"
               style="width: 100%; padding: 12px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-weight: 600;">
      </div>

      <div style="background-color: #f8fafc; padding: 12px; border-radius: 8px; font-size: 13px; color: #334155;">
        <p style="margin: 0 0 4px 0;"><strong>À:</strong> {{ formModel.adresseArrivee || '...' }}</p>
        <p style="margin: 0;">Prix fixé : <span style="color: #00C853; font-weight: 700;">{{ formModel.prix || 0 }} MAD</span> (Cash)</p>
      </div>

      <button type="submit" [disabled]="!formModel.adresseDepart || !formModel.adresseArrivee || !formModel.prix"
              style="width: 100%; background-color: #0f172a; color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">
        Trouver un conducteur
      </button>

    </form>
  </div>
</div>
