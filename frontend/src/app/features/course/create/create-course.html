<div class="create-course-container">
  <h2>Commander une course</h2>

  <div class="form-group">
    <label for="adresseDepart">Adresse de départ</label>
    <input
      id="adresseDepart"
      type="text"
      [(ngModel)]="adresseDepart"
      placeholder="Ex: Gare du Midi"
    />
  </div>

  <div class="form-group">
    <label for="adresseArrivee">Adresse d’arrivée</label>
    <input
      id="adresseArrivee"
      type="text"
      [(ngModel)]="adresseArrivee"
      placeholder="Ex: Aéroport"
    />
  </div>

  <div class="form-group">
    <label for="prix">Prix</label>
    <input
      id="prix"
      type="number"
      [(ngModel)]="prix"
      placeholder="Ex: 25"
    />
  </div>

  <button (click)="createCourse()">Créer la course</button>

  <p *ngIf="message">{{ message }}</p>
</div>
