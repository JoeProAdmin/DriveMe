<div style="width: 100vw; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; overflow-x: hidden;">

  <header style="background-color: #0f172a; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 72px; width: 100%; border-bottom: 3px solid #00C853; position: sticky; top: 0; z-index: 1000; box-sizing: border-box;">
    <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.04em; cursor: pointer; flex-shrink: 0;">Drive<span style="color: #00C853;">Me</span></div>
    <div style="display: flex; align-items: center; gap: 15px; flex-shrink: 0;">
      <button type="button" routerLink="/login" style="background: transparent; border: none; color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;">Connexion</button>
      <button type="button" routerLink="/register" style="background-color: #00C853; color: #ffffff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;">S'inscrire</button>
    </div>
  </header>

  <main style="flex: 1; display: flex; height: calc(100vh - 72px); width: 100%; flex-direction: row; overflow: hidden;">

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px 60px; box-sizing: border-box; min-width: 320px; max-width: 650px;">
      <span style="background-color: rgba(0, 200, 83, 0.1); color: #00C853; padding: 6px 16px; border-radius: 50px; font-size: 13px; font-weight: 700; margin-bottom: 24px; display: inline-block; width: fit-content;">LE COVOITURAGE DE CONFIANCE AU MAROC</span>
      <h1 style="font-size: 38px; font-weight: 700; color: #0f172a; line-height: 1.25; margin: 0 0 20px 0;">Explorez le Maroc à votre prix. Mettez-vous d'accord de gré à gré.</h1>
      <p style="font-size: 15px; color: #475569; line-height: 1.6; margin: 0 0 32px 0;">Que vous soyez citadin ou voyageur en quête de découvertes culturelles de Marrakech à Tanger, DriveMe réinvente la mobilité nationale.</p>

      <div style="display: flex; gap: 16px;">
        <button routerLink="/dashboard/create-course" style="background-color: #0f172a; color: #ffffff; border: none; padding: 16px 32px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 15px rgba(0,0,0,0.1);">Proposer un trajet</button>
        <button routerLink="/register" style="background-color: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; padding: 16px 32px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;">Partager mon véhicule</button>
      </div>
    </div>

    <div style="flex: 1.2; background-image: url('https://images.unsplash.com/photo-1489749798305-4fea3ae63d43?auto=format&fit=crop&w=1200&q=80'); background-size: cover; background-position: center; position: relative;">
      <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, #ffffff 0%, rgba(255,255,255,0) 20%);"></div>
    </div>

  </main>
</div>
