<div class="public-page" [class.rtl]="lang==='AR'"><header class="top"><div class="shell nav"><a class="brand" routerLink="/">Drive<span>Me</span></a><div class="nav-actions"><select [value]="lang" (change)="change($any($event.target).value)"><option>FR</option><option>EN</option><option>AR</option><option>ES</option></select><a class="back" routerLink="/">{{texts[lang].back}}</a></div></div></header><section class="hero"><div class="shell"><span class="eyebrow">{{texts[lang].eye}}</span><h1>{{texts[lang].title}}</h1><p>{{texts[lang].intro}}</p></div></section><main class="shell content"><div class="contact-grid"><aside class="details"><div class="detail"><strong>{{texts[lang].city}}</strong><span>Casablanca, Maroc</span></div><div class="detail"><strong>E-mail</strong><a href="mailto:contact@driveme.cloud">contact@driveme.cloud</a></div><div class="detail"><strong>{{texts[lang].phone}}</strong><span>{{texts[lang].soon}}</span></div></aside><form class="form" (ngSubmit)="submit()"><div class="two"><label>{{texts[lang].name}} *<input [(ngModel)]="form.nom" name="nom" maxlength="100" required></label><label>{{texts[lang].email}} *<input [(ngModel)]="form.email" name="email" type="email" maxlength="150" required></label></div><div class="two"><label>{{texts[lang].tel}}<input [(ngModel)]="form.telephone" name="telephone" maxlength="20"></label><label>{{texts[lang].subject}} *<input [(ngModel)]="form.sujet" name="sujet" maxlength="150" required></label></div><label>{{texts[lang].message}} *<textarea [(ngModel)]="form.message" name="message" maxlength="5000" required></textarea></label><label class="consent"><input type="checkbox" [(ngModel)]="form.consentement" name="consentement"><span>{{texts[lang].consent}} <a routerLink="/privacy" target="_blank">{{texts[lang].privacy}}</a>.</span></label><div *ngIf="success" class="message success">{{success}}</div><div *ngIf="error" class="message error">{{error}}</div><button class="submit" [disabled]="sending">{{sending?texts[lang].sending:texts[lang].send}}</button></form></div></main></div>
