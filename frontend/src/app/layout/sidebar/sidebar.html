<aside class="shell-sidebar">

  <div class="sidebar-brand-block">
    <div class="brand-logo">DM</div>
    <div class="brand-meta">
      <span class="brand-title">DriveMe</span>
      <span class="brand-scope">Enterprise v1.0</span>
    </div>
  </div>

  <div class="i18n-selector-container">
    <select
      (change)="onLanguageChange($event)"
      [value]="apiService.currentLanguage()">

      <option value="fr">Français (FR)</option>
      <option value="en">English (EN)</option>
      <option value="ar">العربية (AR)</option>
      <option value="es">Español (ES)</option>

    </select>
  </div>

  <nav class="sidebar-nav-links">

    <a
      class="nav-link-item"
      routerLink="/dashboard"
      routerLinkActive="active">

      <span>{{ labels[currentLang].overview }}</span>

    </a>

    <a
      *ngIf="userRole === 'ADMIN'"
      class="nav-link-item"
      routerLink="/chauffeurs"
      routerLinkActive="active">

      <span>{{ labels[currentLang].drivers }}</span>

    </a>

    <a
      *ngIf="userRole === 'ADMIN'"
      class="nav-link-item"
      routerLink="/passagers"
      routerLinkActive="active">

      <span>{{ labels[currentLang].passengers }}</span>

    </a>

    <a
      *ngIf="userRole === 'ADMIN' || userRole === 'CHAUFFEUR'"
      class="nav-link-item"
      routerLink="/courses"
      routerLinkActive="active">

      <span>{{ labels[currentLang].trips }}</span>

    </a>

    <a
      *ngIf="userRole === 'ADMIN' || userRole === 'CHAUFFEUR'"
      class="nav-link-item"
      routerLink="/paiements"
      routerLinkActive="active">

      <span>{{ labels[currentLang].payments }}</span>

    </a>

    <a
      *ngIf="userRole === 'PASSAGER'"
      class="nav-link-item"
      routerLink="/courses"
      routerLinkActive="active">

      <span>{{ labels[currentLang].trips }}</span>

    </a>

  </nav>

  <div class="sidebar-user-section">

    <div class="user-card">

      <div class="user-avatar">
        {{ userRole.charAt(0) }}
      </div>

      <div class="user-info">
        <div class="user-role">{{ userRole }}</div>
        <div class="user-email">{{ userEmail }}</div>
      </div>

    </div>

    <button
      class="btn-profile"
      (click)="goToProfile()">

      {{ labels[currentLang].profile }}

    </button>

    <button
      class="btn-logout"
      (click)="logout()">

      {{ labels[currentLang].logout }}

    </button>

    <button
      class="btn-sos"
      (click)="goToSOS()">

      {{ labels[currentLang].emergency }}

    </button>

  </div>

</aside>
