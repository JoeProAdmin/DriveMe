<aside class="shell-sidebar">

  <div class="sidebar-brand-block">
    <div class="brand-icon-wrapper">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981" /><stop offset="100%" stop-color="#059669" /></linearGradient>
        <path d="M25 15C25 15 50 5 75 15V45C75 65 50 85 50 85C50 85 25 65 25 45V15Z" stroke="url(#sideGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M43 35L58 50L43 65" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-meta">
      <span class="brand-title">DriveMe</span>
      <span class="brand-scope">Enterprise v1.0</span>
    </div>
  </div>

  <div class="i18n-selector-container">
    <svg class="selector-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    <select (change)="onLanguageChange($event)" [value]="apiService.currentLanguage()">
      <option value="fr">Français (FR)</option>
      <option value="en">English (EN)</option>
      <option value="ar">العربية (AR)</option>
    </select>
  </div>

  <nav class="sidebar-nav-links">
    <a class="nav-link-item" routerLink="/dashboard" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>{{ labels[apiService.currentLanguage()].overview }}</span>
    </a>
    <a class="nav-link-item" routerLink="/chauffeurs" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>{{ labels[apiService.currentLanguage()].drivers }}</span>
    </a>
    <a class="nav-link-item" routerLink="/passagers" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>{{ labels[apiService.currentLanguage()].passengers }}</span>
    </a>
    <a class="nav-link-item" routerLink="/courses" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>{{ labels[apiService.currentLanguage()].trips }}</span>
    </a>
    <a class="nav-link-item" routerLink="/paiements" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>{{ labels[apiService.currentLanguage()].payments }}</span>
    </a>
  </nav>

  <div class="sidebar-emergency-anchor">
    <button class="btn-emergency-sos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>{{ labels[apiService.currentLanguage()].emergency }}</span>
    </button>
  </div>
</aside>
